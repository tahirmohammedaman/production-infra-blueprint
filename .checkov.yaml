# Checkov configuration.
#
# Suppressions are listed here rather than as inline `checkov:skip=` comments so that the
# full set is reviewable in one place instead of scattered across the tree.

quiet: true
compact: true

skip-path:
  - services/.*/build/.*
  - .*/\.gradle/.*
  # Kustomize patch fragments are not standalone manifests. Checkov reads
  # `patch-scale-down.yaml` as a complete Deployment in the `default` namespace with no
  # securityContext, no probes and no resources, and reports seventeen findings that the
  # rendered output does not have. The rendered output is what CI validates, in the
  # `manifests` job of .github/workflows/ci.yml.
  - deploy/k8s/overlays/.*/patch-.*\.yaml

skip-check:
  # CKV_DOCKER_2 — "ensure a HEALTHCHECK instruction is added".
  #
  # Deliberately not added. The runtime image is distroless: it has no shell, no curl and
  # no wget, so a Docker HEALTHCHECK would have to ship a probe binary purely to satisfy
  # this check, enlarging the image and adding an executable to a runtime whose entire
  # point is that it has none. Health is checked where the orchestrator already knows how:
  # `healthcheck:` in deploy/compose/docker-compose.yml and the readiness/liveness probes
  # in the Kubernetes manifests, both hitting /actuator/health on port 9090.
  - CKV_DOCKER_2

  # CKV_DOCKER_7 — "ensure the base image uses a non-latest version tag".
  #
  # A false positive on this Dockerfile. Both bases are pinned by sha256 digest, which is
  # stricter than any tag, but they are supplied through `ARG JDK_IMAGE=...@sha256:...` so
  # that a rebuild can be retargeted without editing five FROM lines. Checkov evaluates
  # `FROM ${JDK_IMAGE}` without substituting the ARG default and concludes the tag is
  # missing. Re-check this if the ARG indirection is ever removed.
  - CKV_DOCKER_7

  # ---------------------------------------------------------------------------------
  # The object store is Hetzner Object Storage. It is managed with the AWS provider because
  # it speaks S3, which means every AWS S3 policy fires against it. The five below name AWS
  # services that do not exist at this endpoint; the sixth is a deliberate cost decision.
  # Each was verified against the finding, not skipped to get a green run.

  # CKV2_AWS_6 — public access block. Hetzner returns 501 Not Implemented for
  # PutPublicAccessBlock. Adding the resource does not harden the bucket, it breaks every
  # apply. Buckets are private by default; access is granted with scoped credentials.
  - CKV2_AWS_6

  # CKV_AWS_145 — SSE-KMS with a customer-managed key. There is no KMS service at Hetzner.
  # Encryption at rest is applied by the provider and is not configurable.
  - CKV_AWS_145

  # CKV2_AWS_62 — bucket event notifications. Requires SNS, SQS or Lambda. None exist here.
  - CKV2_AWS_62

  # CKV_AWS_18 — S3 server access logging. PutBucketLogging is not implemented at this
  # endpoint. This is a genuine gap rather than a false positive: reads of the backup bucket
  # are not audited, and the compensating control is that only two credentials can reach it.
  # Recorded in docs/security.md rather than pretended away.
  - CKV_AWS_18

  # CKV_AWS_144 — cross-region replication. Deliberately not done. Replication doubles the
  # storage line for a single-node system whose stated availability target does not include
  # surviving the loss of a Hetzner region. The recovery story is base backup plus archived
  # WAL, with a restore drill in docs/runbooks/. Buying replication instead would be paying
  # for a guarantee the rest of the architecture does not make.
  - CKV_AWS_144

  # ---------------------------------------------------------------------------------
  # Kubernetes. Each of these is a deliberate decision recorded in deploy/k8s/README.md,
  # not an oversight — and each was checked against the finding before being skipped.

  # CKV_K8S_11 — CPU limits. Deliberately absent. CFS throttling on a JVM during start-up
  # and garbage collection produces latency spikes indistinguishable from application bugs.
  # CPU *requests* are set on every container, which is what protects the node; this node
  # runs one tenant, so there is nothing to protect it from.
  - CKV_K8S_11

  # CKV_K8S_14 / CKV_K8S_43 — image tag and digest. The base carries `latest` as a
  # placeholder on purpose, so `kubectl apply -k base` cannot deploy production. The prod
  # overlay carries an immutable `<timestamp>-<sha>` tag that Flux's image automation writes
  # and commits. Integrity comes from the cosign signature the cluster's admission policy
  # requires (see ADR 0008), not from a digest pasted into a manifest a bot has to rewrite.
  - CKV_K8S_14
  - CKV_K8S_43

  # CKV_K8S_15 — imagePullPolicy: Always. Wrong for immutable tags: every pod start becomes
  # a registry round trip for an image that cannot have changed, and a registry outage
  # becomes an outage here. IfNotPresent is correct precisely because the tags are unique.
  - CKV_K8S_15

  # CKV_K8S_22 — read-only root filesystem. Set on every container this repository builds.
  # Not set on postgres, kafka and the kafka-topics Job: upstream images write sockets, lock
  # files and stats directories outside their data volumes, and satisfying the check would
  # mean four more emptyDir mounts per pod to make a box tick.
  - CKV_K8S_22

  # CKV_K8S_40 — UID above 10000. Our own images run as 65532. The stock postgres, redis and
  # kafka images have their uid compiled into file ownership inside the image (999, 999,
  # 1000); overriding it makes the container start and then fail on its own data directory.
  - CKV_K8S_40
