# Java toolchain + Gradle cache, in one place.
#
# Every job that touches Gradle needs the same four settings, and the day they drift is
# the day one job is silently building against a different JDK than the others. A
# composite action is the cheapest way to make that impossible.

name: Set up Java and Gradle
description: Provision the Java 21 toolchain and a warm, correctly-scoped Gradle cache

inputs:
  cache-read-only:
    description: >-
      Read the Gradle cache without writing to it. Pull requests must not write the cache:
      a fork PR that can poison the cache can poison every subsequent build on main.
    required: false
    default: 'true'
  cache-encryption-key:
    description: Key used to encrypt the configuration cache before it is stored
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The Gradle toolchain would auto-provision a JDK via foojay if this were absent, but
    # that is a download on every cold runner and an unpinned one. Installing it here makes
    # the version explicit and cached by the runner image.
    - name: Install JDK 21
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        distribution: temurin
        java-version: '21'
        # Caching is left to setup-gradle below, which understands Gradle's layout
        # (dependency cache, configuration cache, build cache) instead of tarring ~/.gradle
        # wholesale and re-uploading 400 MB on every run.
        cache: ''

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
        # The wrapper JAR is committed, so it is checked against Gradle's published
        # checksums on every run. A tampered wrapper is a supply-chain compromise that
        # executes with full build privileges.
        validate-wrappers: true
        build-scan-publish: false
        add-job-summary: on-failure
