# Image build, publish and attestation.
#
# On a pull request: build one architecture, scan it, measure it, and report the size delta
# on the PR. Nothing is pushed. The size budget is a hard gate — this repository's whole
# argument is that the JVM footprint was measured and reduced, and a number that is only
# ever written down drifts back up within three sprints.
#
# On main and tags: build each architecture on its own native runner, push both by digest,
# join them into one multi-arch manifest, scan it, and only then sign it and attach an SBOM
# and SLSA provenance.
#
# Why native runners rather than QEMU: cross-building an arm64 JVM image under emulation
# takes 30+ minutes because Gradle and jlink are both CPU-bound, and the result is
# indistinguishable from what a native arm64 runner produces in three. The target hardware
# is a Hetzner CAX (Ampere) node, so arm64 is the architecture that actually ships.
#
# The image is pushed before it is scanned, which looks backwards and is not: a multi-arch
# manifest cannot be assembled without pushing its parts. The gate is the signature, not the
# push. An image that fails the scan is never signed, and the cluster's admission policy
# requires a valid cosign signature — so an unsigned image in the registry is inert.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TRIVY_VERSION: v0.72.0

jobs:
  # ------------------------------------------------------------------ pull requests
  preflight:
    name: preflight (${{ matrix.service }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Budgets are set from the measured sizes in docs/cost-analysis.md — api 200 MB,
          # worker 164 MB — plus room for one dependency's worth of growth. Crossing the
          # budget is not automatically wrong, but it has to be a decision someone makes.
          - service: api
            budget-mb: 240
          - service: worker
            budget-mb: 200
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services
          target: final
          platforms: linux/amd64
          load: true
          push: false
          tags: blueprint-${{ matrix.service }}:pr
          build-args: |
            SERVICE=${{ matrix.service }}
            APP_VERSION=pr-${{ github.event.pull_request.number }}
            VCS_REF=${{ github.event.pull_request.head.sha }}
          # A shared cache scope would have the two services evicting each other's layers.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: blueprint-${{ matrix.service }}:pr
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          version: ${{ env.TRIVY_VERSION }}
          trivyignores: .trivyignore.yaml

      - name: Measure against the size budget
        id: size
        env:
          SERVICE: ${{ matrix.service }}
          BUDGET_MB: ${{ matrix.budget-mb }}
        run: |
          set -euo pipefail
          bytes=$(docker image inspect "blueprint-${SERVICE}:pr" --format '{{.Size}}')
          mb=$(( bytes / 1000 / 1000 ))
          echo "${SERVICE}: ${mb} MB (budget ${BUDGET_MB} MB)"
          # shellcheck disable=SC2016 # the backticks are markdown, not command substitution
          {
            printf '| `%s` | %s MB | %s MB | ' "${SERVICE}" "${mb}" "${BUDGET_MB}"
            if [[ "${mb}" -le "${BUDGET_MB}" ]]; then echo 'within budget |'; else echo '**over budget** |'; fi
          } > "size-${SERVICE}.md"
          cat "size-${SERVICE}.md" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${mb}" -gt "${BUDGET_MB}" ]]; then
            echo "::error::${SERVICE} image is ${mb} MB, over the ${BUDGET_MB} MB budget"
            exit 1
          fi

      - name: Upload the size row
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-${{ matrix.service }}
          path: size-${{ matrix.service }}.md
          retention-days: 1
          if-no-files-found: ignore

  # One comment for both services, edited in place on every push rather than appended, so a
  # long-running PR does not accumulate twenty size reports nobody reads.
  size-report:
    name: size report
    if: github.event_name == 'pull_request'
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: size-*
          merge-multiple: true
          path: sizes

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # backticks below are markdown, not command substitution
          {
            echo '### Image sizes'
            echo
            echo '| Service | Size | Budget | |'
            echo '| --- | ---: | ---: | --- |'
            cat sizes/*.md
            echo
            echo '_Uncompressed, as reported by `docker image inspect`. Budgets are set from'
            echo 'the measured figures in `docs/cost-analysis.md`._'
          } > comment.md
          gh pr comment "${PR}" --body-file comment.md --edit-last --create-if-none

  # ------------------------------------------------------------ main and tags: publish
  build:
    name: build (${{ matrix.service }}, ${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blueprint-${{ matrix.service }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services
          target: final
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE=${{ matrix.service }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # BuildKit's own provenance and SBOM attachments are switched off deliberately.
          # They add extra entries to the manifest list that `imagetools create` then folds
          # into the final index, and the attestations this pipeline actually relies on are
          # the cosign and SLSA ones attached after the scan passes.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }},mode=max

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish (${{ matrix.service }})
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Both are required for keyless signing: the OIDC token is the identity cosign binds
      # into the certificate, and attestations: write lets the provenance be recorded.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blueprint-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            # Sortable, and the only tag here that is. Flux's ImagePolicy has to decide
            # which of two tags is newer, and it can do that alphabetically or by semver —
            # `latest`, `main` and `sha-abc123` are neither. Most deploys are pushes to main
            # and never get a version tag, so without this the image automation would have
            # nothing to order on and would quietly pick the wrong image.
            # See clusters/prod/image-automation.yaml.
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}},enable={{is_default_branch}}

      - name: Join the per-architecture images into one manifest
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blueprint-${{ matrix.service }}
        run: |
          set -euo pipefail
          # One file per pushed digest, named after it — see the build job above.
          sources=()
          for digest_file in *; do
            sources+=("${IMAGE}@sha256:${digest_file}")
          done
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}" \
                     --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "published ${IMAGE}@${digest}"

      # The gate. Everything below this step is what turns a pushed image into a deployable
      # one, and none of it runs if this fails.
      - name: Scan the published manifest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blueprint-${{ matrix.service }}@${{ steps.manifest.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          version: ${{ env.TRIVY_VERSION }}
          trivyignores: .trivyignore.yaml

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      # Keyless: the signature is bound to this workflow's OIDC identity and recorded in
      # Rekor, so there is no private key to store, rotate or leak. The cost is that
      # verification requires naming the expected identity, which is what
      # scripts/verify-image.sh does and what the cluster's admission policy asserts.
      - name: Sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blueprint-${{ matrix.service }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate an SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blueprint-${{ matrix.service }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # Attached to the image rather than left as a build artifact: an SBOM you have to
      # find the CI run for is not the one anyone consults during an incident. `cosign
      # download attestation` gets it from the registry six months later.
      - name: Attest the SBOM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blueprint-${{ matrix.service }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blueprint-${{ matrix.service }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Report what was published
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blueprint-${{ matrix.service }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          compressed=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw \
            | jq '[.manifests[].size] | add // 0')
          {
            echo "### \`blueprint-${{ matrix.service }}\`"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| platforms | linux/amd64, linux/arm64 |"
            echo "| signature | cosign keyless, recorded in Rekor |"
            echo "| attestations | SPDX SBOM, SLSA provenance |"
            echo "| manifest bytes | ${compressed} |"
            echo
            echo 'Verify with `scripts/verify-image.sh '"${IMAGE}@${DIGEST}"'`.'
          } >> "${GITHUB_STEP_SUMMARY}"
