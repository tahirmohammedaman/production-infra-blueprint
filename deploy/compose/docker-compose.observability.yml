# Observability for the local stack: metrics, logs, traces, alerts and the dashboards over
# them. Applied on top of docker-compose.yml by `make up` and `make bootstrap`, always — a
# local stack with no dashboards is not the thing this repository demonstrates.
#
# A separate file so the application stack still reads on its own. Every configuration file
# mounted below is the one the cluster runs as well; see observability/README.md for how the
# two environments share them.
#
# UIs are published on 127.0.0.1 only. Grafana allows anonymous read access, and nothing here
# has authentication worth the name, which is fine on a laptop and not fine on a café network.
#
# Memory limits are sized from measured RSS after `make smoke`, like the application's; the
# figures are in docs/cost-analysis.md.

x-observability: &observability
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  # Unlike Postgres and Redis (see docker-compose.yml), these images start as an unprivileged
  # user and never change user, so they can drop every capability and keep a read-only root
  # filesystem. Everything they write goes to a named volume or to /tmp.
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=32m

services:
  # Trace export is switched on here, next to Tempo, rather than in the base file. Left on
  # without a receiver the exporter logs an ERROR every few seconds, and a log full of
  # ignorable errors teaches everyone to ignore ERROR.
  api:
    environment:
      OTLP_EXPORT_ENABLED: "true"

  worker:
    environment:
      OTLP_EXPORT_ENABLED: "true"
      # Every trace locally; production samples 10% (application.yml).
      TRACE_SAMPLE_RATE: "1.0"

  # ------------------------------------------------------------------- metrics
  prometheus:
    image: docker.io/prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    <<: *observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # POST /-/reload after editing a rule, instead of restarting and losing the head block.
      - --web.enable-lifecycle
      # exemplar-storage: a latency bucket that links to a trace that actually landed in it.
      # extra-scrape-metrics: exports each target's sample_limit as scrape_sample_limit, so the
      # series budget can be graphed against what is actually scraped.
      - --enable-feature=exemplar-storage,extra-scrape-metrics
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro,z
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9095}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 384m

  alertmanager:
    image: docker.io/prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    <<: *observability
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # One instance, no peers. The gossip listener would be a port opened for nobody.
      - --cluster.listen-address=
    volumes:
      - ../../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 64m

  # ---------------------------------------------------------------------- logs
  loki:
    image: docker.io/grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
    <<: *observability
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ../../observability/loki/loki.yml:/etc/loki/loki.yml:ro,z
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    mem_limit: 256m

  alloy:
    image: docker.io/grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    <<: *observability
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      # Not the image's own /var/lib/alloy/data. That directory belongs to the image's `alloy`
      # user with mode 0770, while Alloy runs here as root — the only user that can open the
      # runtime socket, rootless or not — and root without CAP_DAC_OVERRIDE, which cap_drop
      # removes, cannot enter another user's directory. Alloy crashlooped on "mkdir: permission
      # denied". A volume at a path the image lacks is created owned by the container's user.
      - --storage.path=/var/lib/alloy-state
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ../../observability/alloy:/etc/alloy:ro,z
      # Read-only for the same reason as the gateway's: an agent with write access to the
      # container runtime is root on the host.
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy-state
    depends_on:
      loki:
        condition: service_started
    mem_limit: 192m

  # -------------------------------------------------------------------- traces
  tempo:
    image: docker.io/grafana/tempo:2.10.7@sha256:032b3acb51ed02c4b801473d54bb63e9e9f13738d215126d9843c30283794f4b
    <<: *observability
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ../../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro,z
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    mem_limit: 256m

  # ---------------------------------------------------------------- dashboards
  grafana:
    image: docker.io/grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    <<: *observability
    environment:
      # Read by observability/grafana/provisioning/datasources/datasources.yml, which the
      # cluster uses too with its own service names.
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      ALERTMANAGER_URL: http://alertmanager:9093
      GF_SECURITY_ADMIN_USER: admin
      # A file, like every other credential in this stack; generated by scripts/bootstrap.sh.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/admin_password
      # Read-only without logging in. Dashboards cannot be saved from the UI regardless — they
      # are provisioned from files — so a viewer role loses nothing.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/blueprint-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana 13 tries to download the datasource plugins it no longer bundles (Elasticsearch,
      # Zipkin) at every start, into a directory that is read-only here, and logs an ERROR for
      # each. None of them is used; a runtime that fetches code from the internet on boot is
      # not one this stack wants anyway.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      # The two provisioning directories this stack uses, mounted individually. Mounting the
      # whole of /etc/grafana/provisioning hides the image's empty alerting/ and plugins/
      # directories, and Grafana logs an ERROR for each missing one on every start.
      - ../../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,z
      - ../../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,z
      - ../../observability/grafana/dashboards:/etc/grafana/dashboards:ro,z
      - ./secrets/grafana:/run/secrets:ro,z
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    mem_limit: 256m

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  tempo-data:
  grafana-data:
