apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: blueprint
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
    # The management port is a Service port so Prometheus can scrape it by name, but the
    # NetworkPolicy only admits traffic to it from the monitoring namespace. It is never
    # reachable through the Ingress.
    - name: management
      port: 9090
      targetPort: management
