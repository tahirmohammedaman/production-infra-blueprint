apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: blueprint
  labels:
    app.kubernetes.io/name: worker
spec:
  # Headless: nothing load-balances to the worker. The Service exists so Prometheus has a
  # stable name to scrape and so the NetworkPolicy has a selector to reference.
  clusterIP: None
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: management
      port: 9090
      targetPort: management
