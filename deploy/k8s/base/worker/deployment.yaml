apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: blueprint
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: blueprint
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # Recreate, not RollingUpdate. The worker is a Kafka consumer in a group with one
    # partition per topic: a second replica would sit idle waiting for a partition, and the
    # rolling handover would trigger a consumer-group rebalance while the old pod is still
    # committing. Stopping first is both simpler and faster to recover from, and the outbox
    # means nothing is lost while it is down.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: blueprint
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: worker
          image: ghcr.io/OWNER/blueprint-worker:latest
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          ports:
            - name: management
              containerPort: 9090

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SPRING_DATA_REDIS_HOST
              value: redis

          # No secret volume at all. The worker never opens a database connection - it
          # consumes events and writes a projection to Redis - so it has no reason to be
          # able to read the database password. Least privilege is a mount that is absent,
          # not a permission that is set.

          resources:
            # 311 MB measured steady-state.
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 448Mi

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # The worker has no inbound traffic, so readiness does not gate a load balancer
            # here. It gates the rollout: `kubectl rollout status` waits on it, which is
            # what makes a broken deploy fail the pipeline instead of silently landing.
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
