apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Its own directory because kustomize will only reference another *directory* from outside
# its root, never a bare file. Both deploy/k8s/config/prod and deploy/k8s/overlays/dev need
# this Namespace, and duplicating it would mean the Pod Security Standard labels drifting
# between environments.
resources:
  - namespace.yaml
