apiVersion: v1
kind: Namespace
metadata:
  name: blueprint
  labels:
    app.kubernetes.io/part-of: blueprint
    # Enforced, not just audited. `restricted` is the strictest built-in Pod Security
    # Standard: no privilege escalation, no root, no host namespaces, seccomp required.
    # Every workload here already satisfies it, so turning it on costs nothing today and
    # rejects the pod that would have broken it in six months.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Opts the namespace into signature verification: a pod running one of this repository's
    # images is admitted only if the image was signed by its build workflow
    # (deploy/k8s/infrastructure/configs/image-policy.yaml).
    policy.sigstore.dev/include: "true"
