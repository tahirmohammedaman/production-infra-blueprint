apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: blueprint
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: blueprint
spec:
  backoffLimit: 2
  # Cleaned up an hour after finishing. Long enough to read the logs after a failed deploy,
  # short enough that the namespace does not accumulate one Job per release.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: api
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: migrate
          # The same image as the API. A separate migration image would have its own
          # dependency set and its own Flyway version, and the day those drift from the
          # application's is the day a migration behaves differently in the Job than it did
          # in a test.
          image: ghcr.io/OWNER/blueprint-api:latest

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          # Refresh the context - which is when Flyway runs - and then exit. No server is
          # started and no port is bound; the container's exit code is the migration's
          # result, which is exactly what a Job needs.
          args:
            - --spring.context.exit=onRefresh
            - --spring.flyway.enabled=true
            - --spring.main.web-application-type=none
            - --management.server.port=-1

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_CONFIG_IMPORT
              value: optional:configtree:/run/secrets/
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/blueprint

          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi

          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: secrets
          secret:
            secretName: blueprint-app-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
