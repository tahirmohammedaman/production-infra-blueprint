apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: blueprint
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: blueprint
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: blueprint
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kafka
          image: apache/kafka:4.0.0

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]

          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093

          env:
            # KRaft: one process that is both broker and controller. No ZooKeeper, which is
            # the second JVM this node cannot afford.
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka.blueprint.svc.cluster.local:9093
            # A bare host, not 0.0.0.0. The image's storage-format step rejects 0.0.0.0 here
            # even when advertised.listeners is set explicitly, and reports it as an
            # advertised-listener error - two hours to find, one character to fix.
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka.blueprint.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            # RF=1 on a single broker. A stated non-HA trade-off with an ADR, not an
            # oversight: see docs/adr/0004-kafka-single-broker.md.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            # Topics are created by a deploy-time step, never by a producer. Auto-creation
            # means a typo in a topic name silently produces to a new topic nothing reads.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            # The JVM inside this image does not read the cgroup limit the way ours does.
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx768m

          resources:
            # 326 MB of heap measured, but the number that matters for Kafka is the page
            # cache: segment reads come from it, and starving it turns every consumer fetch
            # into a disk read. The gap between request and limit is that cache.
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 1400Mi

          livenessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:9092
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:9092
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10

          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 8Gi
