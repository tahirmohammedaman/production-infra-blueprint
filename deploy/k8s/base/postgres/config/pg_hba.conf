# Client authentication, selected by hba_file in postgresql.conf. The file initdb writes into the
# data directory is never read.
#
# Who can reach port 5432 at all is decided by the NetworkPolicy: the API, the migration Job and
# the backup CronJob. This file decides how they prove who they are.

# TYPE  DATABASE     USER  ADDRESS      METHOD

# The Unix socket exists only inside the container. It serves the probes and `kubectl exec ...
# psql` in the runbooks; anyone who can exec into the container can already read the password
# files, so a password here would protect nothing.
local   all          all                trust

# Everything over TCP authenticates, localhost included. initdb's own file trusts 127.0.0.1,
# which would extend to any container that ever shares this pod's network namespace.
host    all          all   0.0.0.0/0    scram-sha-256
host    all          all   ::/0         scram-sha-256

# pg_basebackup streams over a replication connection, which `all` does not match. Without this
# line the backup CronJob fails with "no pg_hba.conf entry for replication connection".
host    replication  all   0.0.0.0/0    scram-sha-256
host    replication  all   ::/0         scram-sha-256
