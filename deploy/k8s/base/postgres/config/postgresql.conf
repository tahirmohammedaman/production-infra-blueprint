# Postgres server configuration.
#
# Mounted from the `postgres-config` ConfigMap and selected with `-c config_file=`, so the file
# initdb writes into the data directory is never read. Everything the server runs with is in this
# file and in git; nothing is set on the node by hand or through ALTER SYSTEM.
#
# scripts/restore-drill.sh starts its servers with exactly this file, which is what makes the drill
# a test of production's archiving rather than of a lookalike.

# ---------------------------------------------------------------- connections
listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

# A budget, not a round number. The API's HPA ceiling is four replicas at eight pooled
# connections each, and a rollout at that ceiling surges a fifth: 40. The migration Job, the
# metrics exporter and the three superuser_reserved_connections take it to 45. Base backups
# stream over a replication connection, counted against max_wal_senders rather than here.
# Raising the pool size without raising this moves the queue from the application into the
# database; see docs/operations.md.
max_connections = 50

# --------------------------------------------------------------------- memory
# A quarter of the container's 512 MiB limit. The page cache does the rest, which is why the
# limit is twice the request rather than equal to it.
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 64MB

# ------------------------------------------------------------ write-ahead log
wal_level = replica

# Continuous archiving. Every completed segment is shipped to object storage by
# archive-wal.sh, and Postgres keeps a segment until the command has succeeded for it — so an
# object store outage delays archiving and grows pg_wal, but never loses a segment. Together
# with the nightly base backup this is what makes a point-in-time restore possible.
archive_mode = on
archive_command = '/etc/postgresql/archive-wal.sh %p %f'

# The recovery point objective on a quiet database. A segment is only archived once it is
# full, and at this system's write rate a 16 MB segment can take days to fill; without a
# timeout, the last committed hours would exist only on the node's disk.
archive_timeout = 300

# A timed-out segment is shipped whole, 16 MB however little of it was written. New segment
# files are zero-filled, so their unused tail compresses to almost nothing; a recycled one
# still holds the WAL it last carried and compresses like data. Not recycling costs a file
# creation per segment and makes the timeout above cheap to store: measured in the restore
# drill, see docs/cost-analysis.md.
wal_recycle = off

# Only read during recovery, which prepare-restore.sh sets up. Harmless the rest of the time,
# and here rather than written at restore time so that the one command recovery depends on is
# reviewed like everything else.
restore_command = '/etc/postgresql/restore-wal.sh %f %p'

# -------------------------------------------------------------------- logging
# stderr, collected by the node's log pipeline like every other container.
log_min_duration_statement = 250ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
