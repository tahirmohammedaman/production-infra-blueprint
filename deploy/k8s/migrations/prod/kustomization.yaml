apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blueprint

# Just the migration Job. Its own Flux Kustomization applies it with `wait: true`, so the
# application rollout does not begin until the schema change has actually completed - which
# is the whole mechanism behind an expand/contract deploy being safe.
resources:
  - ../../base/migration

images:
  - name: ghcr.io/OWNER/blueprint-api
    newName: ghcr.io/tahirmohammedaman/blueprint-api
    newTag: latest # {"$imagepolicy": "flux-system:blueprint-api:tag"}
