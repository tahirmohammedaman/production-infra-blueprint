# Loki, single binary, with chunks in object storage.
#
# Chunks go to the Hetzner bucket Terraform created, under the `loki/` prefix whose lifecycle
# rule expires them at 30 days — the same 30 days as retention_period below. The two numbers
# must agree: a bucket that keeps chunks Loki has forgotten bills for data nothing can read
# (infra/terraform/modules/storage).
#
# Everything else matches observability/loki/loki.yml, the Compose configuration: the same
# schema, and the same label budget enforced at ingestion. Keep the two in step.
#
# Object storage credentials are a file, not environment variables: the pod reads them from
# the `loki-object-storage` Secret through AWS_SHARED_CREDENTIALS_FILE, which names a path, not
# a secret. The Secret is created by hand; see deploy/k8s/README.md.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      # 18.7 ships Loki 3.7.4, the version the Compose stack runs.
      version: "18.7.x"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    deploymentMode: Monolithic

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2026-07-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: s3
        bucketNames:
          chunks: blueprint-prod-data
          ruler: blueprint-prod-data
          admin: blueprint-prod-data
        use_thanos_objstore: true
        object_store:
          type: s3
          storage_prefix: loki
          s3:
            endpoint: fsn1.your-objectstorage.com
            region: fsn1
      limits_config:
        retention_period: 720h
        max_label_names_per_series: 4
        allow_structured_metadata: true
        discover_service_name: []
        discover_log_levels: false
        reject_old_samples: true
        reject_old_samples_max_age: 24h
        ingestion_rate_mb: 4
        ingestion_burst_size_mb: 8
        volume_enabled: true
      compactor:
        retention_enabled: true
        delete_request_store: s3
      analytics:
        reporting_enabled: false

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 5Gi
      extraEnv:
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /etc/loki/object-storage/credentials
      extraVolumes:
        - name: object-storage
          secret:
            secretName: loki-object-storage
      extraVolumeMounts:
        - name: object-storage
          mountPath: /etc/loki/object-storage
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

    # The rest of the chart is for scaled-out installations. Every one of these would be a
    # pod on a node sized for the application.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
