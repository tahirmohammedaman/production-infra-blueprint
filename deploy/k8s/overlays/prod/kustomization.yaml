apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blueprint

resources:
  - ../../base

# The Namespace and the encrypted Secrets live in deploy/k8s/config/prod, and the migration
# Job in deploy/k8s/migrations/prod, each applied by its own Flux Kustomization. See
# clusters/prod/apps.yaml for why the split exists.

# The only place production image references exist. Flux's ImageUpdateAutomation rewrites
# the tags here and commits the change, so what is running is always what the repository
# says is running.
images:
  - name: ghcr.io/OWNER/blueprint-api
    newName: ghcr.io/tahirmohammedaman/blueprint-api
    newTag: latest # {"$imagepolicy": "flux-system:blueprint-api:tag"}
  - name: ghcr.io/OWNER/blueprint-worker
    newName: ghcr.io/tahirmohammedaman/blueprint-worker
    newTag: latest # {"$imagepolicy": "flux-system:blueprint-worker:tag"}

patches:
  - path: patch-ingress.yaml
    target:
      kind: Ingress
      name: api
