apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A separate namespace on the same cluster. A second cluster for a development environment
# is the single largest avoidable line in a small hosting bill, and namespace isolation plus
# the NetworkPolicies in the base is enough separation for what dev is actually for.
namespace: blueprint-dev

resources:
  - ../../base
  # Prod applies these in stages, through separate Flux Kustomizations (clusters/prod/apps.yaml).
  # Dev has no such split - there are no encrypted secrets to order around - so it takes every
  # component in one go and kustomize moves them all into this namespace.
  - ../../base/namespace
  - ../../base/network
  - ../../base/postgres
  - ../../base/redis
  - ../../base/kafka
  - ../../base/migration

# Dev secrets are generated from literals rather than encrypted. They protect nothing —
# the values are visible in this file — and the point is that dev needs no key material to
# stand up. The generator's name suffix means changing a value rolls the pods that read it,
# which is behaviour prod deliberately does not want mid-incident.
secretGenerator:
  - name: blueprint-app-secrets
    literals:
      - spring.datasource.password=dev-only-not-a-secret
  - name: blueprint-postgres-credentials
    literals:
      - postgres-password=dev-only-not-a-secret

images:
  - name: ghcr.io/OWNER/blueprint-api
    newName: ghcr.io/tahirmohammedaman/blueprint-api
    newTag: main
  - name: ghcr.io/OWNER/blueprint-worker
    newName: ghcr.io/tahirmohammedaman/blueprint-worker
    newTag: main

patches:
  - path: patch-scale-down.yaml
    target:
      kind: Deployment
      name: api
  - path: patch-ingress.yaml
    target:
      kind: Ingress
      name: api
  # Dev runs one API replica, so a PodDisruptionBudget requiring one available makes the
  # node permanently undrainable — an upgrade hangs forever with no obvious cause.
  - patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: api
    target:
      kind: PodDisruptionBudget
      name: api
  # Applied in one go, the migration Job starts alongside the database it migrates instead of
  # after it, as the prod stages guarantee. Ten retries on the Job controller's exponential
  # backoff wait out a cold Postgres start; the base's two are spent before it has one.
  - patch: |
      - op: replace
        path: /spec/backoffLimit
        value: 10
    target:
      kind: Job
      name: migrate
  # Dev has no object storage to archive to or back up into. Without these two patches its
  # Postgres would wait for a credential Secret nobody creates, and once given one, keep every
  # WAL segment it could not ship until the volume filled. The command-line setting wins over
  # postgresql.conf, so the file stays production's.
  - patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
      spec:
        template:
          spec:
            containers:
              - name: postgres
                args: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, archive_mode=off]
                volumeMounts:
                  - mountPath: /run/object-storage
                    $patch: delete
            volumes:
              - name: object-storage
                $patch: delete
    target:
      kind: StatefulSet
      name: postgres
  - patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: postgres-backup
    target:
      kind: CronJob
      name: postgres-backup
  # Nothing load-tests dev, so an autoscaler here only ever fights the replica patch above.
  - patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: api
    target:
      kind: HorizontalPodAutoscaler
      name: api
