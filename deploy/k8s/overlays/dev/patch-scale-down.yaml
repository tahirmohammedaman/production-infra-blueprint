apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          resources:
            # Dev shares a node with prod. Requesting what prod requests would let an idle
            # dev environment refuse a prod scale-up, which is a strange way to spend money.
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 512Mi
