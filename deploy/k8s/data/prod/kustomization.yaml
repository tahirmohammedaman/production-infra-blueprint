apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blueprint

# The three stores, applied by the `apps-data` Flux Kustomization after the namespace, its
# secrets and its NetworkPolicies exist, and before the migration Job that needs Postgres.
#
# They used to be part of the application kustomization, which the migration stage runs ahead
# of. On an existing cluster that order is harmless — Postgres is already there. On a fresh one
# the migration Job waited for a database that only the next stage would create, and the chain
# never completed. Found by bringing the manifests up in a cluster for the first time.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: blueprint
      app.kubernetes.io/managed-by: flux

resources:
  - ../../base/postgres
  - ../../base/redis
  - ../../base/kafka
