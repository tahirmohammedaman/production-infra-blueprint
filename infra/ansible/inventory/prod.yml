# The node's address comes from `terraform output node_ipv4`. It is written here rather than
# generated by a dynamic inventory plugin because there is exactly one host: a plugin that
# queries the Hetzner API on every run would add a dependency and a failure mode to save
# editing one line, once.
---
all:
  hosts:
    blueprint-prod:
      ansible_host: "{{ lookup('ansible.builtin.env', 'BLUEPRINT_NODE_IP') | default('203.0.113.10', true) }}"
      ansible_user: deploy
      ansible_python_interpreter: /usr/bin/python3

      # Must match infra/terraform/envs/prod/main.tf. k3s binds to this address so that
      # cluster traffic stays off the public NIC.
      node_private_ip: 10.0.1.10
      private_network_cidr: 10.0.0.0/16

      # From `terraform output data_volume_device`. The by-id path is stable across
      # reattachment; /dev/sdb is not.
      data_volume_device: /dev/disk/by-id/scsi-0HC_Volume_100000000

  vars:
    cluster_hostname: blueprint.example.com
