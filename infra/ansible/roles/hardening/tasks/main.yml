---
- name: Harden the SSH daemon
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    owner: root
    group: root
    # A syntax error here locks everyone out of the only node. Validate before writing.
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Apply kernel network and memory settings
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-blueprint.conf
    reload: true
    state: present
  loop:
    # --- required by k3s --protect-kernel-defaults, which refuses to start without them ---
    - { name: vm.panic_on_oom, value: "0" }
    - { name: kernel.panic, value: "10" }
    - { name: kernel.panic_on_oops, value: "1" }
    # The JVM reserves far more virtual address space than it commits; strict accounting
    # refuses those reservations and the process dies at startup with no useful message.
    - { name: vm.overcommit_memory, value: "1" }

    # --- network hardening ---
    - { name: net.ipv4.conf.all.rp_filter, value: "1" }
    - { name: net.ipv4.conf.all.accept_redirects, value: "0" }
    - { name: net.ipv6.conf.all.accept_redirects, value: "0" }
    - { name: net.ipv4.conf.all.send_redirects, value: "0" }
    - { name: net.ipv4.conf.all.accept_source_route, value: "0" }
    - { name: net.ipv4.tcp_syncookies, value: "1" }
    - { name: net.ipv4.icmp_echo_ignore_broadcasts, value: "1" }

    # --- capacity, learned from running the stack ---
    # Kafka and Postgres between them keep far more file descriptors open than the default
    # inotify limits allow once the kubelet is also watching every container's logs.
    - { name: fs.inotify.max_user_instances, value: "1024" }
    - { name: fs.inotify.max_user_watches, value: "524288" }
    # A single node running six services plus an observability stack runs out of connection
    # tracking entries long before it runs out of CPU.
    - { name: net.netfilter.nf_conntrack_max, value: "262144" }
  loop_control:
    label: "{{ item.name }}"

# Kernel modules that nothing here uses and that have a history of local privilege
# escalation. Blacklisting is cheap; each of these is a module that cannot be loaded by a
# container that shouldn't have been able to ask.
- name: Disable unused filesystem and network modules
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blueprint-blacklist.conf
    mode: "0644"
    content: |
      # Managed by Ansible - infra/ansible/roles/hardening
      install cramfs /bin/true
      install freevxfs /bin/true
      install jffs2 /bin/true
      install hfs /bin/true
      install hfsplus /bin/true
      install squashfs /bin/false
      install udf /bin/true
      install dccp /bin/true
      install sctp /bin/true
      install rds /bin/true
      install tipc /bin/true

- name: Restrict access to the deploy user's home
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}"
    mode: "0750"
    state: directory
