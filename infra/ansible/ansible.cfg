[defaults]
inventory            = inventory/prod.yml
roles_path           = roles
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = yaml
# Every task must be named. An unnamed task is unreadable in output and invisible in a
# diff, and ansible-lint enforces the same rule in CI.
display_skipped_hosts = False
interpreter_python   = /usr/bin/python3

[ssh_connection]
pipelining = True
# Multiplexing turns a 40-task play from 40 TCP handshakes into one.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
