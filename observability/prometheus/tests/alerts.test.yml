# promtool unit tests for alerts.yml. Run with `make obs-validate`.
#
# An alert rule is code that only runs during an incident, which is the worst time to learn
# it has a typo in a label name or a window that never lines up. Each test feeds synthetic
# series through the real rule and asserts when it fires — and, just as important, when it
# must not.

rule_files:
  - ../rules/recording.yml
  - ../rules/alerts.yml

evaluation_interval: 1m

tests:
  - name: relay stall pages only when events wait and nothing is published
    interval: 1m
    input_series:
      - series: 'blueprint_outbox_pending_events{job="api", instance="api-1"}'
        values: '0x5 12x30'
      - series: 'blueprint_outbox_published_total{job="api", instance="api-1"}'
        values: '40x40'
    alert_rule_test:
      # Waiting since minute 6. The 10m min_over_time window is clean from minute 15, and the
      # rule then has to hold for its 5m `for`.
      - eval_time: 19m
        alertname: OutboxRelayStalled
        exp_alerts: []
      - eval_time: 21m
        alertname: OutboxRelayStalled
        exp_alerts:
          - exp_labels:
              severity: page
              service: api
              job: api
            exp_annotations:
              summary: The outbox relay has stopped publishing and events are piling up
              description: >-
                12 or more events have been waiting for at least 15 minutes with nothing
                published. The API is serving normally; the inventory read model is not being
                updated.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#outboxrelaystalled

  - name: a busy relay with a standing backlog is not a stall
    interval: 1m
    input_series:
      - series: 'blueprint_outbox_pending_events{job="api", instance="api-1"}'
        values: '80x40'
      - series: 'blueprint_outbox_published_total{job="api", instance="api-1"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: OutboxRelayStalled
        exp_alerts: []

  - name: an idle relay with nothing waiting is not a stall
    interval: 1m
    input_series:
      - series: 'blueprint_outbox_pending_events{job="api", instance="api-1"}'
        values: '0x40'
      - series: 'blueprint_outbox_published_total{job="api", instance="api-1"}'
        values: '7x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: OutboxRelayStalled
        exp_alerts: []

  - name: the gateway disappearing pages even though no series says it is down
    interval: 1m
    input_series:
      # Scraped for five minutes, then the target vanishes entirely — what happens in the
      # cluster when the pod is gone, as opposed to up == 0 when it is merely failing.
      - series: 'up{job="gateway", instance="gateway-1"}'
        values: '1x5 _x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: GatewayDown
        exp_alerts: []
      # Stale after the 5m lookback, then the 2m `for`.
      - eval_time: 13m
        alertname: GatewayDown
        exp_alerts:
          - exp_labels:
              severity: page
              service: gateway
            exp_annotations:
              summary: The gateway is down or unscrapeable, so the availability SLO is blind
              description: >-
                No healthy gateway target for 2 minutes. Requests may all be failing, and the
                error-budget alerts cannot fire without gateway metrics.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#gatewaydown

  - name: a dead-lettered record raises a ticket and clears once the window passes
    interval: 1m
    input_series:
      - series: 'blueprint_events_dead_lettered_total{job="worker", instance="worker-1"}'
        values: '0x5 1x30'
    alert_rule_test:
      - eval_time: 7m
        alertname: DeadLetterTopicReceiving
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: worker
              job: worker
            exp_annotations:
              summary: Events are being routed to the dead-letter topic
              description: >-
                Records dead-lettered in the last 15 minutes: 1. Each one
                exhausted its retries or could not be parsed, and is an update the read model never
                applied.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#deadlettertopicreceiving
      - eval_time: 25m
        alertname: DeadLetterTopicReceiving
        exp_alerts: []

  - name: a reconciler that defers every run for two hours raises a ticket
    interval: 5m
    input_series:
      # One run every five minutes, each one deferred.
      - series: 'blueprint_projection_reconcile_deferred_total{job="api", instance="api-1"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 2h
        alertname: ReconciliationStarved
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: api
              job: api
              instance: api-1
            exp_annotations:
              summary: The projection has not been reconciled on api-1 for two hours
              description: >-
                Every reconciliation run in the last two hours found events in flight and stood
                down. Drift, if there is any, is not being repaired.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#reconciliationstarved

  - name: a reconciler that finds a lull now and then is not starved
    interval: 5m
    input_series:
      # Deferred for most runs, but every fourth one proceeds.
      - series: 'blueprint_projection_reconcile_deferred_total{job="api", instance="api-1"}'
        values: '0 1 2 3 3 4 5 6 6 7 8 9 9 10 11 12 12 13 14 15 15 16 17 18 18 19 20 21 21 22 23'
    alert_rule_test:
      - eval_time: 150m
        alertname: ReconciliationStarved
        exp_alerts: []

  - name: a failing scrape names the job it failed for
    interval: 1m
    input_series:
      - series: 'up{job="api", instance="api-1"}'
        values: '1x3 0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: api
              job: api
              instance: api-1
            exp_annotations:
              summary: Prometheus cannot scrape api at api-1
              description: >-
                The target has failed every scrape for 5 minutes. Either the process is down, or
                it returned more samples than its sample_limit and the whole scrape was rejected.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#targetdown

  - name: the only consumer disappearing pages
    interval: 1m
    input_series:
      - series: 'up{job="worker", instance="worker-1"}'
        values: '1x5 _x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: WorkerDown
        exp_alerts: []
      - eval_time: 17m
        alertname: WorkerDown
        exp_alerts:
          - exp_labels:
              severity: page
              service: worker
            exp_annotations:
              summary: No worker is consuming, so the inventory read model is going stale
              description: The only consumer of item-events has been unreachable for 5 minutes. Writes still succeed, the inventory summary stops reflecting them, and consumer lag is not reported while nothing is consuming.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#workerdown

  - name: events out of attempts raise a ticket that says how many
    interval: 1m
    input_series:
      - series: 'blueprint_outbox_stuck_events{job="api", instance="api-1"}'
        values: '0x3 2x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: OutboxEventsStuck
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: api
              job: api
            exp_annotations:
              summary: 2 outbox events exhausted their publish attempts
              description: These events will never be published without intervention. The reconciler keeps the read model's totals correct, but no consumer ever sees these events.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#outboxeventsstuck

  - name: lag is summed across partitions before it is compared
    interval: 1m
    input_series:
      # 600 behind on each of three partitions: no single one crosses 1000, the group does.
      - series: 'kafka_consumer_fetch_manager_records_lag{job="worker", instance="worker-1", topic="item-events", partition="0"}'
        values: '600x30'
      - series: 'kafka_consumer_fetch_manager_records_lag{job="worker", instance="worker-1", topic="item-events", partition="1"}'
        values: '600x30'
      - series: 'kafka_consumer_fetch_manager_records_lag{job="worker", instance="worker-1", topic="item-events", partition="2"}'
        values: '600x30'
    alert_rule_test:
      - eval_time: 13m
        alertname: ConsumerLagHigh
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: worker
              job: worker
              topic: item-events
            exp_annotations:
              summary: The worker is 1800 records behind on item-events
              description: Lag has stayed above 1000 records for 10 minutes. The worker is alive and consuming, but slower than events arrive.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#consumerlaghigh

  - name: a drift correction raises a ticket for an hour
    interval: 1m
    input_series:
      - series: 'blueprint_projection_drift_corrections_total{job="api", instance="api-1"}'
        values: '0x5 1x60'
    alert_rule_test:
      - eval_time: 8m
        alertname: ProjectionDriftCorrected
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: api
              job: api
            exp_annotations:
              summary: The reconciler corrected drift between the read model and Postgres
              description: The inventory projection disagreed with the system of record and was rewritten. Something upstream dropped or repeated an event.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#projectiondriftcorrected

  - name: sustained queueing for connections raises a ticket
    interval: 1m
    input_series:
      - series: 'hikaricp_connections_pending{job="api", instance="api-1", pool="blueprint-pool"}'
        values: '0x2 3x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: DatabasePoolExhausted
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: api
              job: api
              instance: api-1
            exp_annotations:
              summary: Requests on api-1 are queueing for database connections
              description: Threads have been waiting for a pooled connection for 5 minutes. Latency will climb before errors do; the latency SLO pages if it gets that far.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#databasepoolexhausted

  - name: a moment of queueing for connections does not
    interval: 1m
    input_series:
      - series: 'hikaricp_connections_pending{job="api", instance="api-1", pool="blueprint-pool"}'
        values: '0 3 0 0 3 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 10m
        alertname: DatabasePoolExhausted
        exp_alerts: []

  - name: cache errors that last raise a ticket
    interval: 1m
    input_series:
      - series: 'blueprint_cache_requests_total{job="api", instance="api-1", result="error"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 13m
        alertname: CacheUnavailable
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: api
              job: api
            exp_annotations:
              summary: The API cannot reach Redis and is serving reads from Postgres
              description: Cache lookups have been failing for 10 minutes. Responses are still correct, but database load is multiplied and the worker cannot update the projection either.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#cacheunavailable

  - name: a heap that stays full raises a ticket against the service it belongs to
    interval: 1m
    input_series:
      - series: 'jvm_memory_used_bytes{job="api", instance="api-1", area="heap", id="Tenured Gen"}'
        values: '950x20'
      - series: 'jvm_memory_max_bytes{job="api", instance="api-1", area="heap", id="Tenured Gen"}'
        values: '1000x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: JvmHeapPressure
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: api
              job: api
              instance: api-1
            exp_annotations:
              summary: api-1 has used over 90% of its heap for 15 minutes
              description: Sustained, not a spike before a collection. The heap is derived from the container memory limit, so the limit is what to revisit, against the measured RSS.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#jvmheappressure

  - name: a certificate ten days from expiry raises a ticket, one twenty days out does not
    # One-minute samples, as cert-manager's metric is scraped. At ten-minute spacing the series
    # goes stale between samples, the rule's one-hour `for` resets every time, and the alert
    # never fires — a test that fails for a reason production never has.
    interval: 1m
    input_series:
      # Test time starts at the epoch, so these are "ten days" and "twenty days" from then.
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="blueprint-tls", namespace="blueprint"}'
        values: '864000x80'
      - series: 'certmanager_certificate_expiration_timestamp_seconds{name="blueprint-dev-tls", namespace="blueprint-dev"}'
        values: '1728000x80'
    alert_rule_test:
      - eval_time: 70m
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: gateway
              name: blueprint-tls
              namespace: blueprint
            exp_annotations:
              summary: The certificate blueprint-tls expires in under 14 days
              description: cert-manager renews at 30 days remaining, so a certificate this close to expiry has already failed to renew at least once.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#certificateexpiringsoon

  - name: log lines dropped by the pipeline raise a ticket
    interval: 1m
    input_series:
      - series: 'loki_write_dropped_entries_total{job="alloy", instance="alloy-1"}'
        values: '0+5x20'
    alert_rule_test:
      - eval_time: 13m
        alertname: LogPipelineDropping
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: monitoring
              job: alloy
            exp_annotations:
              summary: Alloy is dropping log lines instead of delivering them to Loki
              description: Lines rejected by Loki are discarded after retries. The usual cause is a new label exceeding the label budget, which Loki rejects outright.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#logpipelinedropping

  - name: a failing receiver is named in the ticket
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager-0", integration="slack"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 18m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: monitoring
              integration: slack
            exp_annotations:
              summary: Alertmanager cannot deliver to slack
              description: Alerts are firing and nobody is being told. The dead man's switch still works if the webhook integration is healthy; check which one is failing.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#alertmanagernotificationsfailing

  - name: a rule group that stops evaluating is named in the ticket
    interval: 1m
    input_series:
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus", instance="localhost:9090", rule_group="/etc/prometheus/rules/slo.yml;blueprint.slo.windows"}'
        values: '0x3 1x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: PrometheusRuleFailures
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: monitoring
              rule_group: /etc/prometheus/rules/slo.yml;blueprint.slo.windows
            exp_annotations:
              summary: Rules in /etc/prometheus/rules/slo.yml;blueprint.slo.windows are failing to evaluate
              description: A rule that fails to evaluate never fires. Every alert in the group is silently disabled until this is fixed.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#prometheusrulefailures

  - name: the watchdog is always firing
    interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
              service: monitoring
            exp_annotations:
              summary: The alerting pipeline is working. This alert is supposed to be firing.
              description: >-
                Routed to the dead man's switch. If it ever stops, Prometheus, Alertmanager, or the
                route between them has failed.
              runbook_url: https://github.com/tahirmohammedaman/production-infra-blueprint/blob/main/docs/runbooks/alerts.md#watchdog
