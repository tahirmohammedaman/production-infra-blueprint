# Prometheus for the local Compose stack.
#
# The rule files are shared with the cluster, byte for byte: deploy/k8s/infrastructure/
# observability mounts the same directory. What differs between the two environments is only
# how targets are found (static names here, Kubernetes service discovery there) and the `env`
# external label, which Alertmanager routes on. Job names are identical in both, because every
# rule and dashboard selects on them.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    # Alertmanager sends nothing for env="local"; see observability/alertmanager.
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# sample_limit is the series budget, enforced rather than documented. A scrape that returns
# more samples than its limit fails as a whole — `up` drops to 0 and TargetDown fires — so a
# new high-cardinality label breaks loudly on the laptop of whoever added it, instead of
# quietly doubling the storage bill in production. Each limit is roughly twice the measured
# count; the measurements are in docs/cost-analysis.md.
scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    sample_limit: 1500
    static_configs:
      - targets: [api:9090]

  - job_name: worker
    metrics_path: /actuator/prometheus
    sample_limit: 1200
    static_configs:
      - targets: [worker:9090]

  - job_name: gateway
    sample_limit: 1000
    static_configs:
      - targets: [gateway:8080]

  # The monitoring stack watches itself. A log pipeline that silently drops lines and an
  # Alertmanager that cannot deliver are both failures nothing else would report.
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  # Grafana exports about 3,700 series about itself — measured, more than the API and the
  # worker combined. Whether it is up, how fast it answers and how much memory it holds is all
  # anyone operating it needs; the rest is dropped at scrape time, before it costs anything.
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: grafana_build_info|grafana_http_request_duration_seconds_(count|sum)|process_(resident_memory_bytes|cpu_seconds_total|start_time_seconds)
        action: keep
