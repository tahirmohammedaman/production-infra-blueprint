# Prometheus for the local Compose stack.
#
# The rule files are shared with the cluster, byte for byte: deploy/k8s/infrastructure/
# observability mounts the same directory. What differs between the two environments is only
# how targets are found (static names here, Kubernetes service discovery there) and the `env`
# external label, which Alertmanager routes on. Job names are identical in both, because every
# rule and dashboard selects on them.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    # Alertmanager sends nothing for env="local"; see observability/alertmanager.
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# sample_limit is the series budget, enforced rather than documented. A scrape that returns
# more samples than its limit fails as a whole — `up` drops to 0 and TargetDown fires — so a
# new high-cardinality label breaks loudly on the laptop of whoever added it, instead of
# quietly doubling the storage bill in production. Each limit is roughly twice the measured
# count; the measurements are in docs/cost-analysis.md.
scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    sample_limit: 1500
    static_configs:
      - targets: [api:9090]

  - job_name: worker
    metrics_path: /actuator/prometheus
    sample_limit: 1200
    static_configs:
      - targets: [worker:9090]

  - job_name: gateway
    sample_limit: 1000
    static_configs:
      - targets: [gateway:8080]

  # The monitoring stack watches itself. A log pipeline that silently drops lines and an
  # Alertmanager that cannot deliver are both failures nothing else would report.
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
