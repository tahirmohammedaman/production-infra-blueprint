# Trivy suppressions.
#
# Policy, not a suggestion: every entry needs a `statement` saying why the finding does not
# apply here, and an `expired_at` date. An unexplained, unexpiring suppression is how a
# scanner quietly stops being a control — the entry outlives the reason, nobody remembers
# who added it, and the next person assumes it was justified.
#
# When an entry expires the finding comes back and someone has to look at it again. That is
# the point.
#
#   vulnerabilities:
#     - id: CVE-0000-00000
#       paths: ["services/api/build/libs/app.jar"]
#       statement: "Not reachable: the vulnerable codec is never invoked on our paths."
#       expired_at: 2026-10-01
#
# Empty by design. Findings are fixed by upgrading, not by ignoring; `ignore-unfixed` in
# the workflow already excludes the ones no upgrade exists for.

vulnerabilities: []

misconfigurations:
  # The object store is Hetzner Object Storage, managed with the AWS provider because it
  # speaks S3. Trivy sees `aws_s3_bucket` and applies AWS policy, which is the right default
  # and the wrong answer here: none of these four APIs exist at the endpoint. Hetzner returns
  # 501 Not Implemented for PutPublicAccessBlock, so adding the resource does not harden the
  # bucket — it breaks every apply. Buckets are private unless a policy says otherwise, and
  # access is granted with scoped credentials.
  #
  # The expiry is a reminder to re-check whether Hetzner has implemented these since.
  - id: AWS-0086
    paths: ["infra/terraform/modules/storage/main.tf"]
    statement: "Hetzner Object Storage returns 501 for PutPublicAccessBlock; buckets are private by default."
    expired_at: 2027-01-31
  - id: AWS-0087
    paths: ["infra/terraform/modules/storage/main.tf"]
    statement: "Hetzner Object Storage returns 501 for PutPublicAccessBlock; buckets are private by default."
    expired_at: 2027-01-31
  - id: AWS-0091
    paths: ["infra/terraform/modules/storage/main.tf"]
    statement: "Hetzner Object Storage returns 501 for PutPublicAccessBlock; buckets are private by default."
    expired_at: 2027-01-31
  - id: AWS-0093
    paths: ["infra/terraform/modules/storage/main.tf"]
    statement: "Hetzner Object Storage returns 501 for PutPublicAccessBlock; buckets are private by default."
    expired_at: 2027-01-31

  # There is no KMS at Hetzner, so there is no customer-managed key to encrypt with.
  # Server-side encryption at rest is applied by the provider and is not configurable.
  - id: AWS-0132
    paths: ["infra/terraform/modules/storage/main.tf"]
    statement: "No KMS service exists at this endpoint; SSE-KMS is not an option Hetzner offers."
    expired_at: 2027-01-31

secrets: []
licenses: []
